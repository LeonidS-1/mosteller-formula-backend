<html lang="ru">
    <head>
        <title>Расчёт дозы по ППТ — Препараты</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <a href="/" class="header-home">
                <img src="/static/img/logo.svg" alt="Расчёт дозы по ППТ" class="header-home__icon">
            </a>
        </header>
        <div class="toolbar">
            <form action="/" method="GET" class="search-form">
                <input type="text" name="query" class="search-input" placeholder="Поиск препаратов..." value="{{ .query }}">
                <button type="submit" class="search-btn">Найти</button>
            </form>
            {{ if ne .prescription_count 0 }}
            <a href="/prescriptions/{{ .prescription_id }}" class="prescription-icon" title="Текущий рецепт (черновик)">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="2" width="18" height="20" rx="2"/>
                    <circle cx="9" cy="8" r="2.5"/>
                    <path d="M5 15c0-2 2-3 4-3s4 1 4 3"/>
                    <line x1="15" y1="7" x2="19" y2="7"/>
                    <line x1="15" y1="11" x2="18" y2="11"/>
                    <line x1="15" y1="15" x2="17" y2="15"/>
                </svg>
                <span class="prescription-icon__badge">{{ .prescription_count }}</span>
            </a>
            {{ else }}
            <div class="prescription-icon prescription-icon--inactive" title="Нет активного черновика рецепта">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="2" width="18" height="20" rx="2"/>
                    <circle cx="9" cy="8" r="2.5"/>
                    <path d="M5 15c0-2 2-3 4-3s4 1 4 3"/>
                    <line x1="15" y1="7" x2="19" y2="7"/>
                    <line x1="15" y1="11" x2="18" y2="11"/>
                    <line x1="15" y1="15" x2="17" y2="15"/>
                </svg>
                <span class="prescription-icon__badge prescription-icon__badge--empty">0</span>
            </div>
            {{ end }}
        </div>
        <div class="space">
            <div class="container">
                {{ range .drugs }}
                <div class="card-wrapper">
                    <a href="/drugs/{{ .DrugID }}" class="card" data-video="{{ $.minioUrl }}/{{ .Video }}">
                        <img src="{{ $.minioUrl }}/{{ .PhotoURL }}" alt="{{ .Title }}">
                        <div class="card__body">
                            <h2 class="card__title">{{ .Title }}</h2>
                            <div class="card__coefficients">
                                <div class="card__coeff-item card__coeff-item--latency">
                                    <span class="card__coeff-label">Разовая (взр.)</span>
                                    <span class="card__coeff-value">{{ printf "%.0f" .AdultDoseMg }} мг</span>
                                </div>
                                <div class="card__coeff-item card__coeff-item--throughput">
                                    <span class="card__coeff-label">На м² ППТ</span>
                                    <span class="card__coeff-value">{{ printf "%.0f" .DosePerM2Mg }} мг/м²</span>
                                </div>
                                <div class="card__coeff-item card__coeff-item--reliability">
                                    <span class="card__coeff-label">Макс. сут.</span>
                                    <span class="card__coeff-value">{{ printf "%.0f" .MaxDailyMg }} мг</span>
                                </div>
                            </div>
                        </div>
                    </a>
                    <form method="POST" action="/prescriptions/add" class="card-add-form">
                        <input type="hidden" name="drug_id" value="{{ .DrugID }}">
                        <button type="submit" class="card-add-btn">Добавить в рецепт</button>
                    </form>
                </div>
                {{ end }}
            </div>
        </div>
    </body>
</html>
