<html lang="ru">
    <head>
        <title>{{ .drug.Title }} — Подробная информация</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header>
            <a href="/" class="header-home">
                <img src="/static/img/logo.svg" alt="Расчёт дозы по ППТ" class="header-home__icon">
            </a>
        </header>
        <div class="detail-wrapper">
            <div class="detail-card">
                <div class="detail-card__video-wrap">
                    <video class="detail-card__video" controls autoplay muted loop>
                        <source src="{{ .minioUrl }}/{{ .drug.Video }}" type="video/mp4">
                    </video>
                    <div class="detail-card__video-coefficients">
                        <div class="detail-card__coeff-item detail-card__coeff-item--latency">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M9 2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="12" cy="13" r="7" stroke="currentColor" stroke-width="2"/>
                                <path d="M12 9v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span class="detail-card__coeff-value">{{ printf "%.0f" .drug.AdultDoseMg }} мг</span>
                        </div>

                        <div class="detail-card__coeff-item detail-card__coeff-item--throughput">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <polygon points="2,8 12,8 19.5,14.614 9.5,14.614" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>
                            </svg>
                            <span class="detail-card__coeff-value">{{ printf "%.0f" .drug.DosePerM2Mg }} мг/м²</span>
                        </div>

                        <div class="detail-card__coeff-item detail-card__coeff-item--reliability">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M8.5 12l2.2 2.2L15.8 9.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span class="detail-card__coeff-value">{{ printf "%.0f" .drug.MaxDailyMg }} мг</span>
                        </div>
                    </div>
                    <div class="detail-card__video-bottom">
                        <h1 class="detail-card__video-title">{{ .drug.Title }}</h1>
                        <form method="POST" action="/prescriptions/add" class="detail-card__add-form">
                            <input type="hidden" name="drug_id" value="{{ .drug.DrugID }}">
                            <button type="submit" class="search-btn">Добавить в рецепт</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
